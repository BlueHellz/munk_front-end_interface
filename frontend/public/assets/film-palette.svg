<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Filmstrip Reel (Left) -->
  <g stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <rect x="110" y="150" width="130" height="210" rx="12" fill="none" />
    <line x1="155" y1="150" x2="155" y2="360" />
    <!-- Sprocket holes -->
    <rect x="122" y="168" width="18" height="18" rx="3" fill="#ffffff" stroke="none" />
    <rect x="122" y="206" width="18" height="18" rx="3" fill="#ffffff" stroke="none" />
    <rect x="122" y="244" width="18" height="18" rx="3" fill="#ffffff" stroke="none" />
    <rect x="122" y="282" width="18" height="18" rx="3" fill="#ffffff" stroke="none" />
    <rect x="122" y="320" width="18" height="18" rx="3" fill="#ffffff" stroke="none" />
    <!-- Movie frame dividers -->
    <line x1="155" y1="202" x2="240" y2="202" />
    <line x1="155" y1="254" x2="240" y2="254" />
    <line x1="155" y1="306" x2="240" y2="306" />
  </g>

  <!-- Artist Palette (Center & Right) -->
  <path d="M 270,185 C 335,110 430,150 440,235 C 450,320 415,405 310,415 C 225,425 185,340 215,280 C 230,250 205,225 230,200 C 245,185 255,195 270,185 Z"
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Palette Thumb Hole -->
  <circle cx="262" cy="278" r="22" fill="none" stroke="#ffffff" stroke-width="12" />

  <!-- 4 Paint Dots -->
  <circle cx="395" cy="255" r="14" fill="#ffffff" />
  <circle cx="400" cy="308" r="14" fill="#ffffff" />
  <circle cx="370" cy="355" r="14" fill="#ffffff" />
  <circle cx="320" cy="382" r="14" fill="#ffffff" />

  <!-- Paintbrush (Diagonal Through Palette) -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="195" y1="415" x2="248" y2="298" />
    <circle cx="262" cy="278" r="8" fill="#ffffff" stroke="none" />
    <path d="M 276,258 L 395,130 C 418,105 440,118 428,150 L 302,280" />
  </g>

  <!-- Sparkle Star (Top) -->
  <path d="M 305,90 C 305,112 310,122 328,122 C 310,122 305,132 305,154 C 305,132 300,122 282,122 C 300,122 305,112 305,90 Z" fill="#ffffff" />
</svg>
